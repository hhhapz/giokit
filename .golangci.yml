# A small, reviewed static-analysis set for the root module. Not a CI gate:
# review findings before fixing them, and never apply quickfixes wholesale
# (removing explicit embedded selectors or rewriting conditions is not
# automatically clearer). Run: golangci-lint run ./...
version: "2"

run:
  relative-path-mode: gomod

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
  settings:
    staticcheck:
      checks:
        # golangci-lint's defaults (all, minus the stylecheck rules it
        # disables)...
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # ...minus rewrites that are not improvements here: explicit
        # embedded selectors document which field is meant, and De Morgan
        # forms often read closer to the rule they state.
        - -QF1001
        - -QF1008
    errcheck:
      # Writes to os.Stderr from command-line error paths have nowhere to
      # report a failure.
      exclude-functions:
        - fmt.Fprintln(os.Stderr)
        - fmt.Fprintf(os.Stderr)
        # Harness.Dump is a best-effort debugging aid for any io.Writer.
        - fmt.Fprintf
        # Closing a file opened only for reading, or a D-Bus connection
        # after its call finished, has no failure the caller can act on.
        # Written files check Close explicitly.
        - (*os.File).Close
        - (*github.com/godbus/dbus/v5.Conn).Close
  exclusions:
    paths:
      - gio # the Gio fork: upstream's code, linted by upstream's standards
      - media

issues:
  # Report every finding: default caps hide how many there are.
  max-issues-per-linter: 0
  max-same-issues: 0
